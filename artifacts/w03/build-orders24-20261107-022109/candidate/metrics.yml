version: 2
semantic_models:
- name: order_facts
  model: ref('order_facts')
  defaults:
    agg_time_dimension: ordered_at
  entities:
  - name: order
    type: primary
    expr: order_id
  - name: member
    type: foreign
    expr: member_id
  - name: store
    type: foreign
    expr: store_id
  - name: home_store
    type: foreign
    expr: home_store_id
  dimensions:
  - name: ordered_at
    type: time
    type_params:
      time_granularity: day
  - name: channel
    type: categorical
    expr: channel
  - name: status
    type: categorical
    expr: status
  measures:
  - name: m_order_count
    expr: '1'
    agg: sum
  - name: m_paid_order_count
    expr: CASE WHEN status = 'paid' THEN 1 ELSE 0 END
    agg: sum
  - name: m_valid_order_count
    expr: CASE WHEN status = 'paid' AND paid_cents - refund_cents > 0 THEN 1 ELSE
      0 END
    agg: sum
  - name: m_cancelled_order_count
    expr: CASE WHEN status = 'cancelled' THEN 1 ELSE 0 END
    agg: sum
  - name: m_refund_order_count
    expr: CASE WHEN status = 'paid' AND refund_cents > 0 THEN 1 ELSE 0 END
    agg: sum
  - name: m_partial_refund_order_count
    expr: CASE WHEN status = 'paid' AND refund_cents > 0 AND refund_cents < paid_cents
      THEN 1 ELSE 0 END
    agg: sum
  - name: m_full_refund_order_count
    expr: CASE WHEN status = 'paid' AND paid_cents > 0 AND refund_cents = paid_cents
      THEN 1 ELSE 0 END
    agg: sum
  - name: m_payment_cents
    expr: CASE WHEN status = 'paid' THEN paid_cents ELSE 0 END
    agg: sum
  - name: m_refund_cents
    expr: CASE WHEN status = 'paid' THEN refund_cents ELSE 0 END
    agg: sum
  - name: m_net_sales_cents
    expr: CASE WHEN status = 'paid' THEN paid_cents - refund_cents ELSE 0 END
    agg: sum
  - name: m_gross_cents
    expr: CASE WHEN status = 'paid' THEN gross_cents ELSE 0 END
    agg: sum
  - name: m_discount_cents
    expr: CASE WHEN status = 'paid' THEN gross_cents - paid_cents ELSE 0 END
    agg: sum
  - name: m_buyer_count
    expr: CASE WHEN status = 'paid' AND paid_cents - refund_cents > 0 THEN member_id
      END
    agg: count_distinct
  - name: m_refund_buyer_count
    expr: CASE WHEN status = 'paid' AND refund_cents > 0 THEN member_id END
    agg: count_distinct
  - name: m_selling_store_count
    expr: CASE WHEN status = 'paid' AND paid_cents - refund_cents > 0 THEN store_id
      END
    agg: count_distinct
  - name: m_valid_order_items
    expr: CASE WHEN status = 'paid' AND paid_cents - refund_cents > 0 THEN quantity
      ELSE 0 END
    agg: sum
- name: member_accounts
  model: ref('members')
  defaults:
    agg_time_dimension: registered_at
  entities:
  - name: member
    type: primary
    expr: member_id
  - name: home_store
    type: foreign
    expr: home_store_id
  dimensions:
  - name: registered_at
    type: time
    type_params:
      time_granularity: day
  - name: tier
    type: categorical
    expr: tier
  measures: []
- name: store_profile
  model: ref('store_profile')
  entities:
  - name: store
    type: primary
    expr: store_id
  dimensions:
  - name: region
    type: categorical
    expr: region
  - name: store_name
    type: categorical
    expr: store_name
  measures: []
- name: home_store_profile
  model: ref('home_store_profile')
  entities:
  - name: home_store
    type: primary
    expr: store_id
  dimensions:
  - name: region
    type: categorical
    expr: region
  - name: store_name
    type: categorical
    expr: store_name
  measures: []
metrics:
- name: order_count
  label: 创建订单数
  description: 按下单日期统计全部订单，每个订单号一次，包含取消单。
  type: simple
  type_params:
    measure: m_order_count
- name: paid_order_count
  label: 支付订单数
  description: 状态为 paid 的订单数，包括后来全部退款的订单。
  type: simple
  type_params:
    measure: m_paid_order_count
- name: valid_order_count
  label: 有效订单数
  description: 状态为 paid 且实付金额减退款金额大于零的订单数；取消和全退不计。
  type: simple
  type_params:
    measure: m_valid_order_count
- name: cancelled_order_count
  label: 取消订单数
  description: 状态为 cancelled 的订单数。
  type: simple
  type_params:
    measure: m_cancelled_order_count
- name: refund_order_count
  label: 退款订单数
  description: paid 状态且退款金额大于零的订单数，包括部分退款与全部退款。
  type: simple
  type_params:
    measure: m_refund_order_count
- name: partial_refund_order_count
  label: 部分退款订单数
  description: paid 状态且退款大于零、小于实付金额的订单数。
  type: simple
  type_params:
    measure: m_partial_refund_order_count
- name: full_refund_order_count
  label: 全额退款订单数
  description: paid 状态且实付大于零、退款等于实付的订单数。
  type: simple
  type_params:
    measure: m_full_refund_order_count
- name: payment_cents
  label: 实付金额
  description: paid 订单实付金额合计，尚未扣退款；单位分。
  type: simple
  type_params:
    measure: m_payment_cents
- name: refund_cents
  label: 退款金额
  description: paid 订单退款金额合计，按原订单下单日期归属，不是现金退款发生日；单位分。
  type: simple
  type_params:
    measure: m_refund_cents
- name: net_sales_cents
  label: 净销售额
  description: paid 订单实付减退款后合计；取消单不计；按原订单下单日期归属；单位分。
  type: simple
  type_params:
    measure: m_net_sales_cents
- name: gross_cents
  label: 支付订单原价金额
  description: paid 订单折扣前原价金额合计；单位分。
  type: simple
  type_params:
    measure: m_gross_cents
- name: discount_cents
  label: 优惠金额
  description: paid 订单原价减实付的金额合计；退款不冲减原优惠金额；单位分。
  type: simple
  type_params:
    measure: m_discount_cents
- name: buyer_count
  label: 购买会员数
  description: 统计窗口及筛选条件内有有效订单的不同 CRM 会员账户数，不做跨系统自然人去重。
  type: simple
  type_params:
    measure: m_buyer_count
- name: refund_buyer_count
  label: 退款会员数
  description: 统计窗口内发生退款的 paid 订单关联的不同 CRM 会员账户数。
  type: simple
  type_params:
    measure: m_refund_buyer_count
- name: selling_store_count
  label: 成交门店数
  description: 窗口内至少有一笔有效订单的不同订单归属门店数。
  type: simple
  type_params:
    measure: m_selling_store_count
- name: valid_order_items
  label: 有效订单商品件数
  description: 有效订单中的原始购买件数合计；退款金额不能推算退货件数，此项不是净商品销量。
  type: simple
  type_params:
    measure: m_valid_order_items
- name: avg_order_value
  label: 有效订单均额
  description: 净销售额除以有效订单数，单位分／单；分母零时未定义。
  type: ratio
  type_params:
    numerator: net_sales_cents
    denominator: valid_order_count
- name: avg_buyer_value
  label: 购买会员人均消费
  description: 净销售额除以购买会员数，单位分／账户；分母零时未定义。
  type: ratio
  type_params:
    numerator: net_sales_cents
    denominator: buyer_count
- name: purchase_frequency
  label: 购买频次
  description: 有效订单数除以购买会员数，单位单／账户；分母零时未定义。
  type: ratio
  type_params:
    numerator: valid_order_count
    denominator: buyer_count
- name: refund_amount_rate
  label: 退款金额占比
  description: 退款金额除以实付金额；分母零时未定义。
  type: ratio
  type_params:
    numerator: refund_cents
    denominator: payment_cents
- name: cancel_rate
  label: 取消率
  description: 取消订单数除以创建订单数；分母零时未定义。
  type: ratio
  type_params:
    numerator: cancelled_order_count
    denominator: order_count
- name: refund_order_rate
  label: 退款订单率
  description: 退款订单数除以支付订单数；分母零时未定义。
  type: ratio
  type_params:
    numerator: refund_order_count
    denominator: paid_order_count
- name: discount_rate
  label: 优惠率
  description: 优惠金额除以支付订单原价金额；分母零时未定义。
  type: ratio
  type_params:
    numerator: discount_cents
    denominator: gross_cents
- name: items_per_order
  label: 单均商品件数
  description: 有效订单商品件数除以有效订单数；分母零时未定义。
  type: ratio
  type_params:
    numerator: valid_order_items
    denominator: valid_order_count
